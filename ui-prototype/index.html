<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>询盘工作台 · TradeDesk AI Workbench</title>
<meta name="description" content="外贸业务员的 AI 数字员工工作台 —— 询盘应答 Agent（Inquiry）、交易风控 Agent（Sentinel）与人工签核闸门的原型界面">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="app">
  <!-- 左侧导航 -->
  <aside class="rail">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16v12H4z"/><path d="M4 11h16M9 7v12"/></svg>
      </div>
      <div>
        <div class="brand-name">TradeDesk AI</div>
        <div class="brand-sub">外贸数字员工工作台</div>
      </div>
    </div>

    <nav class="nav" aria-label="主导航">
      <div class="rail-label">工作区</div>
      <a href="index.html" aria-current="page"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h5l2 3h4l2-3h5M3 12l2.5-7h13L21 12v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>询盘工作台<span class="count">12</span></a>
      <a href="dashboard.html"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>运营看板</a>
      <a href="knowledge.html"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2z"/><path d="M8 3v18"/></svg>知识库与检索</a>

      <div class="rail-label" style="margin-top:16px">Agent</div>
      <button type="button" data-agent-id="inquiry.reply" aria-haspopup="dialog" title="查看角色契约"><span class="dot dot-live" aria-hidden="true"></span>Inquiry 询盘应答<span class="count">在线</span></button>
      <button type="button" data-agent-id="sentinel.risk" aria-haspopup="dialog" title="查看角色契约"><span class="dot dot-live" aria-hidden="true"></span>Sentinel 交易风控<span class="count">在线</span></button>
      <button type="button" data-agent-id="merch.listing" aria-haspopup="dialog" title="查看角色契约"><span class="dot dot-decl" aria-hidden="true"></span>Merch 商品运营<span class="count">仅声明</span></button>
      <button type="button" data-agent-id="growth.campaign" aria-haspopup="dialog" title="查看角色契约"><span class="dot dot-decl" aria-hidden="true"></span>Growth 推广<span class="count">仅声明</span></button>
    </nav>

    <div class="rail-foot">
      <div class="agent-chip"><span class="dot dot-live" aria-hidden="true"></span><span>本地 Docker · 云端模型 API</span></div>
      <div style="margin-top:6px" id="current-user">当前用户：<b>—</b></div>
      <div style="margin-top:4px"><button type="button" class="signout" id="signout">切换身份</button></div>
      <div style="margin-top:2px">版本 v1.0.1 · 本地 Demo</div>
    </div>
  </aside>

  <main class="main">
    <!-- 顶栏 -->
    <header class="topbar">
      <div>
        <h1>询盘工作台</h1>
        <div class="sub">询盘自动应答 · 报价人工签核 · 合同必须人工确认</div>
      </div>

      <div class="demo-select">
        <label for="demo-script">演示场景</label>
        <select class="select" id="demo-script"></select>
        <span class="hint" id="data-source">演示数据（mock）</span>
      </div>

      <div class="kpis">
        <div class="kpi">
          <span class="kpi-label">待签核</span>
          <span class="kpi-value" id="kpi-pending">12</span>
        </div>
        <div class="kpi">
          <span class="kpi-label">SLA 即将超时</span>
          <span class="kpi-value warn" id="kpi-sla">3</span>
        </div>
        <div class="kpi">
          <span class="kpi-label">今日成本</span>
          <span class="kpi-value" id="kpi-cost">¥1.86 <small>/ 预算 ¥2.40</small></span>
        </div>
      </div>
    </header>

    <!-- 三栏工作区 -->
    <div class="workbench">
      <!-- 左：线程看板 -->
      <section class="pane pane-threads" aria-label="询盘线程看板">
        <div class="pane-hd">
          <h2>询盘线程</h2>
          <span class="count" id="thread-count"></span>
        </div>
        <div class="filters">
          <div class="field">
            <label class="sr-only" for="thread-search">搜索线程</label>
            <input class="input" id="thread-search" type="search" placeholder="搜索公司、编号或标题…">
          </div>
          <div class="filter-row" data-group="stage" role="group" aria-label="按阶段筛选">
            <button class="chip" aria-pressed="true" data-value="all">全部阶段</button>
            <button class="chip" aria-pressed="false" data-value="INQUIRY">询盘</button>
            <button class="chip" aria-pressed="false" data-value="SAMPLING">样品</button>
            <button class="chip" aria-pressed="false" data-value="QUOTING">报价</button>
            <button class="chip" aria-pressed="false" data-value="ORDERED">订单</button>
          </div>
          <div class="filter-row" data-group="lang" role="group" aria-label="按语种筛选">
            <button class="chip" aria-pressed="true" data-value="all">全部语种</button>
            <button class="chip" aria-pressed="false" data-value="en">EN</button>
            <button class="chip" aria-pressed="false" data-value="es">ES</button>
            <button class="chip" aria-pressed="false" data-value="ar">AR</button>
          </div>
          <div class="filter-row" data-group="risk" role="group" aria-label="按风险筛选">
            <button class="chip" aria-pressed="true" data-value="all">全部风险</button>
            <button class="chip" aria-pressed="false" data-value="high">高</button>
            <button class="chip" aria-pressed="false" data-value="mid">中</button>
            <button class="chip" aria-pressed="false" data-value="low">低</button>
          </div>
        </div>
        <ul class="threads" id="thread-list" role="listbox" aria-label="询盘线程列表" tabindex="0"></ul>
      </section>

      <!-- 中：会话与草稿 -->
      <section class="pane conversation" id="conversation" aria-label="会话与草稿"></section>

      <!-- 右：签核与风控 -->
      <section class="pane pane-review" id="review" aria-label="签核与风控"></section>
    </div>
  </main>
</div>
<div class="toast-host" aria-live="polite"></div>
<script src="assets/config.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/data.js"></script>
<script src="assets/api.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
